<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 592" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS','Segoe Print','Chalkboard SE','KaiTi','STKaiti',cursive">
<title>EngineCore.step 一轮调度循环的内部细节</title>
<desc>队列经 scheduler.schedule 拼批并分配 KV block，送到 GPU 跑一次 forward 与采样，再由 update_from_output 更新状态，未完成请求回到 running 进入下一轮。</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="60" y="48" width="560" height="456" rx="18" fill="#F1EFE8" fill-opacity="0.5" stroke="#888780" stroke-width="1" stroke-dasharray="7 6"/>
<text x="78" y="66" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">EngineCore 的 busy loop：反复 step()，一轮长这样</text>

<rect x="150" y="88" width="380" height="60" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<rect x="151.6" y="89.8" width="380" height="60" rx="10" fill="none" stroke="#534AB7" stroke-width="0.8" opacity="0.35"/>
<text x="340" y="108" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">waiting / running 队列</text>
<text x="340" y="128" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">running 优先续跑，waiting 补空位</text>
<text x="160" y="168" font-size="11" fill="#534AB7" text-anchor="start" dominant-baseline="central">每轮都重新挑一批请求</text>

<rect x="150" y="188" width="380" height="72" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<rect x="151.6" y="189.8" width="380" height="72" rx="10" fill="none" stroke="#534AB7" stroke-width="0.8" opacity="0.35"/>
<text x="340" y="208" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">scheduler.schedule()</text>
<text x="340" y="228" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">凑一批：总数 ≤ max_num_seqs，token ≤ max_num_batched_tokens</text>
<text x="340" y="248" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">为新 block 分配 KV cache，生成 block_table</text>
<text x="160" y="280" font-size="11" fill="#534AB7" text-anchor="start" dominant-baseline="central">空闲 block 不足 → 抢占 / 换出</text>

<rect x="150" y="300" width="380" height="72" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
<rect x="151.6" y="301.8" width="380" height="72" rx="10" fill="none" stroke="#3B6D11" stroke-width="0.8" opacity="0.35"/>
<text x="340" y="320" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">一次 forward：prefill + decode</text>
<text x="340" y="340" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">attention 按 block_table 读写 KV cache → MLP → logits</text>
<text x="340" y="360" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">sample：批内每个请求各出 1 个新 token</text>
<text x="160" y="392" font-size="11" fill="#3B6D11" text-anchor="start" dominant-baseline="central">一个请求也能单独成批</text>

<rect x="150" y="412" width="380" height="72" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<rect x="151.6" y="413.8" width="380" height="72" rx="10" fill="none" stroke="#534AB7" stroke-width="0.8" opacity="0.35"/>
<text x="340" y="432" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">update_from_output()</text>
<text x="340" y="452" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">追加新 token，判定 stop / length 等 finish_reason</text>
<text x="340" y="472" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">完成者回收 block，未完成者留在 running</text>

<rect x="190" y="524" width="300" height="48" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<rect x="191.6" y="525.8" width="300" height="48" rx="10" fill="none" stroke="#185FA5" stroke-width="0.8" opacity="0.35"/>
<text x="340" y="548" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">完成 → 输出并回收 KV block</text>

<path d="M340 148 L340 186" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M340 260 L340 298" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M340 372 L340 410" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M340 484 L340 522" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M150 448 L118 448 Q110 448 110 440 L110 232 Q110 224 118 224 L146 224" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow2)"/>
<text x="68" y="336" font-size="11" fill="#534AB7" text-anchor="start" dominant-baseline="central">循环</text>
<text x="68" y="350" font-size="11" fill="#534AB7" text-anchor="start" dominant-baseline="central">再挑批</text>
<text x="68" y="364" font-size="11" fill="#534AB7" text-anchor="start" dominant-baseline="central">新请求插队</text>
</svg>
