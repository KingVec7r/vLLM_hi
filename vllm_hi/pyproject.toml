[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-hi"
version = "0.1.0"
description = "Low-downtime live migration for vLLM inference services, via monkey-patching and a plugin (no vLLM source changes)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["vllm", "llm", "inference", "hot-migration", "kubernetes", "scaling", "serving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "vllm>=0.13.0",
    "fastapi",
    "httpx",
    "pydantic>=2",
    "uvicorn",
]

# Register the vllm_hi plugin via the vllm.general_plugins entry point.
# This plugin group is loaded in every vllm process (process0, engine core,
# worker), so the engine_internals patches also take effect in worker
# subprocesses.
[project.entry-points."vllm.general_plugins"]
vllm_hi = "vllm_hi.patches.plugin:load"

[tool.setuptools.packages.find]
include = ["vllm_hi*"]
